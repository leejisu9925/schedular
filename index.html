<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨🐥🍀 - 통합 스케줄러 & 투두 (PWA)</title>

  <!-- PWA 기본 설정 -->
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="스케줄러">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @font-face {
      font-family: 'PyeojinGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/PyeojinGothic.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: 'PyeojinGothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #334155;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .soft-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 10px -2px rgba(0, 0, 0, 0.03);
      border-radius: 16px;
    }

    .time-grid-slot {
      height: 48px;
      border-bottom: 1px dashed #e2e8f0;
      transition: background-color 0.15s ease;
    }
    .time-grid-slot:hover { background-color: #f1f5f9; }

    .user-select-none { user-select: none; -webkit-user-select: none; }

    .drag-selection-highlight {
      background-color: rgba(203, 213, 225, 0.45);
      border: 2px dashed #94a3b8;
      position: absolute;
      pointer-events: none;
      z-index: 20;
      border-radius: 6px;
    }

    .plate-head {
      font-size: 10px; font-weight: 700; color: #94a3b8;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none; cursor: pointer;
    }
    .plate-head:hover { color: #1e293b; }
    .plate-well {
      aspect-ratio: 1 / 1; border-radius: 9999px; border: 1px solid #cbd5e1;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 700; color: #1e293b; overflow: hidden;
      cursor: pointer; user-select: none; -webkit-user-select: none; line-height: 1; white-space: nowrap;
    }
    .plate-well-sm { border-radius: 3px; }
    .plate-well.well-sel { outline: 2px solid #1e293b; outline-offset: 1px; }

    .current-time-indicator {
      position: absolute; left: 0; right: 0; height: 2px;
      background-color: #ef4444; z-index: 30; pointer-events: none;
    }
  </style>

  <!-- PWA 매니페스트 및 서비스 워커 연동 -->
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered'))
          .catch(err => console.error('Service Worker Registration Failed:', err));
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('pwaInstallBtn');
      if (btn) btn.classList.remove('hidden');
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          const btn = document.getElementById('pwaInstallBtn');
          if (btn) btn.classList.add('hidden');
        });
      }
    }
  </script>
</head>
<body class="min-h-screen flex bg-white text-slate-800">

  <!-- 좌측 내비게이터 바 -->
  <aside class="w-64 bg-[#f8fafc] border-r border-slate-200 flex flex-col justify-between p-6 sticky top-0 h-screen z-30">
    <div>
      <div class="mb-5">
        <h1 class="text-base font-black tracking-wider text-slate-800">✨🐥🍀</h1>
        <p class="text-[11px] text-slate-500 mt-0.5">통합 스케줄러 & To do list</p>
      </div>

      <button id="pwaInstallBtn" onclick="installPWA()" class="hidden w-full mb-4 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl shadow-xs transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-download"></i>
        <span>✨ 앱으로 설치하기</span>
      </button>

      <div class="relative mb-6">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input id="globalSearchInput" type="text" autocomplete="off" placeholder="Search (Ctrl+K)" oninput="renderSearchResults()" onfocus="renderSearchResults()"
               class="w-full pl-8 pr-3 py-2 text-xs rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-slate-300">
      </div>

      <nav class="space-y-1.5">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-3">MENU</div>
        
        <button onclick="switchTab('home')" id="nav-home" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition nav-btn bg-[#f1f5f9] text-slate-900 border border-slate-300 shadow-2xs">
          <span class="flex items-center gap-2.5">🤍 Home</span>
        </button>

        <button onclick="switchTab('calendar')" id="nav-calendar" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-[#f1f5f9] transition nav-btn">
          <span class="flex items-center gap-2.5">📆 Calendar</span>
        </button>

        <button onclick="switchTab('weekly')" id="nav-weekly" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-[#f1f5f9] transition nav-btn">
          <span class="flex items-center gap-2.5">🕒 Weekly Schedule</span>
        </button>

        <button onclick="switchTab('protocol')" id="nav-protocol" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-[#f1f5f9] transition nav-btn">
          <span class="flex items-center gap-2.5">🔬 Protocols</span>
        </button>

        <button onclick="switchTab('design')" id="nav-design" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-[#f1f5f9] transition nav-btn">
          <span class="flex items-center gap-2.5">🧫 Plate Design</span>
        </button>

        <button onclick="switchTab('calc')" id="nav-calc" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-[#f1f5f9] transition nav-btn">
          <span class="flex items-center gap-2.5">🧮 Calculators</span>
        </button>
      </nav>
    </div>

    <div class="pt-4 border-t border-slate-200 space-y-3">
      <div class="bg-white border border-slate-200 rounded-xl p-2.5 space-y-1">
        <button onclick="openBackupModal()" class="w-full flex items-center justify-between text-[11px] font-bold text-slate-700 hover:text-slate-900">
          <span>💾 백업 / 복원</span><i class="fa-solid fa-chevron-right text-[9px] text-slate-400"></i>
        </button>
        <p id="backupStatusText" class="text-[10px] leading-snug text-slate-400">마지막 백업: -</p>
      </div>
      <p class="text-[11px] text-slate-400 text-center">✨ 2026 Scheduler (PWA)</p>
    </div>
  </aside>

  <!-- 메인 컨텐츠 영역 -->
  <main class="flex-1 p-8 overflow-y-auto max-h-screen">
    <section id="tab-content-home" class="space-y-6">
      <div class="soft-card p-8 bg-gradient-to-r from-slate-100 to-slate-200 text-slate-900 border border-slate-300 rounded-2xl relative overflow-hidden shadow-xs">
        <h3 class="text-2xl font-black mb-2">스케줄러 대시보드 PWA 앱</h3>
        <p class="text-xs text-slate-600">독립 실행 및 오프라인 환경을 완벽하게 지원합니다.</p>
      </div>
    </section>
  </main>
</body>
</html>
